# Installed by obs-studio-rockchip (obs-jfmpp). Keeps PipeWire away from the RK3588 HDMI-in
# audio card: the Rockchip HDMI Input source in OBS records it itself.
#
# The vendor kernel marks an open HDMI-in capture stream as disconnected whenever the
# HDMI source re-detects the receiver (replug, EDID switch, receiver reset), and it only
# works again after reopening. PipeWire keeps retrying instead and floods the log with
# "snd_pcm_status error: File descriptor in bad state".
#
# To hand the card back to PipeWire, override this in /etc/wireplumber/wireplumber.conf.d/
# or ~/.config/wireplumber/wireplumber.conf.d/ with device.disabled = false.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "rockchip,hdmiin" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
